services:
  docs-swarmauri-com:
    build: .
    container_name: docs-swarmauri-com
    restart: unless-stopped
    labels:
      site.host: docs.swarmauri.com
      site.kind: zdx-docs
    expose:
      - "80"
    networks:
      docs-swarmauri-com-private: {}
      portwyrm-edge:
        aliases:
          - docs-swarmauri-com

networks:
  docs-swarmauri-com-private:
    name: docs-swarmauri-com-private
    internal: true
  portwyrm-edge:
    name: portwyrm-edge
    external: true
